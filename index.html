<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4a6bff;
      --secondary-color: #ff6b6b;
      --background-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333;
      --shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--background-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    * {
      box-sizing: border-box;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      border-radius: 15px;
      background-color: var(--card-bg);
      box-shadow: var(--shadow);
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: var(--primary-color);
      position: relative;
      display: inline-block;
    }

    h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      border-radius: 2px;
    }

    .subtitle {
      color: #666;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .nav-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      transition: var(--transition);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    .nav-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }

    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px 20px;
      text-decoration: none;
      color: var(--text-color);
      background-color: var(--card-bg);
      height: 100%;
      transition: var(--transition);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }

    .nav-link:hover {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    }

    .nav-icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: var(--primary-color);
    }

    .nav-title {
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .nav-desc {
      font-size: 0.9rem;
      color: #666;
      text-align: center;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #777;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .container {
        width: 95%;
        padding: 20px 15px;
      }

      h1 {
        font-size: 2rem;
      }

      .nav-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>我的个人主页</h1>
      <p class="subtitle">欢迎访问我的项目展示空间</p>
    </header>

    <div class="nav-grid">
      <div class="nav-item">
        <a href="PBR/step4.html" class="nav-link">
          <div class="nav-icon"><i class="fas fa-cube"></i></div>
          <div class="nav-title">PBR渲染</div>
          <div class="nav-desc">基于物理的真实感渲染技术</div>
        </a>
      </div>

      <div class="nav-item">
        <a href="colorConvert/index.html" class="nav-link">
          <div class="nav-icon"><i class="fas fa-palette"></i></div>
          <div class="nav-title">颜色转换器</div>
          <div class="nav-desc">在不同颜色格式之间轻松转换</div>
        </a>
      </div>

      <div class="nav-item">
        <a href="occlusion/index.html" class="nav-link">
          <div class="nav-icon"><i class="fas fa-layer-group"></i></div>
          <div class="nav-title">遮挡</div>
          <div class="nav-desc">探索图形遮挡效果的演示</div>
        </a>
      </div>

      <div class="nav-item">
        <a href="phong/index.html" class="nav-link">
          <div class="nav-icon"><i class="fas fa-lightbulb"></i></div>
          <div class="nav-title">Phong光照模型</div>
          <div class="nav-desc">3D渲染中的光照效果展示</div>
        </a>
      </div>

      <div class="nav-item">
        <a href="spiralSearch/index.html" class="nav-link">
          <div class="nav-icon"><i class="fas fa-search"></i></div>
          <div class="nav-title">螺旋搜索</div>
          <div class="nav-desc">螺旋形搜索算法的可视化</div>
        </a>
      </div>
    
    </div>

    <footer>
      <p>© 2025 陈东民 | 个人作品集</p>
    </footer>
  </div>
</body>

</html>
