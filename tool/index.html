<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工具合集</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-color: #4a6bff;
            --secondary-color: #ff6b6b;
            --background-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: "Poppins", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        * {
            box-sizing: border-box;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            border-radius: 15px;
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .breadcrumb {
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: #666;
        }

        .breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary-color);
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg,
                    var(--primary-color),
                    var(--secondary-color));
            border-radius: 2px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .category {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 4px solid var(--primary-color);
        }

        .algorithm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .algorithm-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .algorithm-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .algorithm-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .algorithm-icon {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .algorithm-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .algorithm-desc {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .algorithm-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: rgba(74, 107, 255, 0.1);
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            margin-bottom: 30px;
        }

        .back-btn:hover {
            background: #3a5bef;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 20px 15px;
                margin-top: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .algorithm-grid {
                grid-template-columns: 1fr;
            }

            .category-title {
                font-size: 1.3rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>
    <div class="container">
        <a href="../index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            返回主页
        </a>

        <div class="breadcrumb"><a href="../index.html">首页</a> / 工具演示</div>

        <header>
            <h1>工具演示合集</h1>
            <p class="subtitle">各种便捷工具的实现</p>
        </header>

        <!-- 搜索工具 -->
        <div class="category">
            <h2 class="category-title">搜索工具</h2>
            <div class="algorithm-grid">

                <div class="algorithm-card">
                    <a href="./2fa.html" class="algorithm-link">
                        <div class="algorithm-icon"><i class="fas fa-sliders-h"></i></div>
                        <div class="algorithm-title">2FA</div>
                        <div class="algorithm-desc">
                            2FA双因素验证工具
                        </div>
                    </a>
                </div>

            </div>
        </div>

        <footer style="
          margin-top: 50px;
          text-align: center;
          color: #777;
          font-size: 0.9rem;
        ">
            <p>© 2025 陈东民 | 工具合集</p>
        </footer>
    </div>
</body>

</html>
