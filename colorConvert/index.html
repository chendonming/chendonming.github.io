<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色转换工具</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>颜色转换工具</h1>

    <div class="layout">
        <div class="main-container">
            <div class="container">
                <div class="input-group">
                    <label for="hex-input">HEX:</label>
                    <span class="prefix">#</span>
                    <input type="text" id="hex-input" maxlength="6" placeholder="FFFFFF">
                </div>

                <div class="input-group">
                    <label for="rgb-r">RGB:</label>
                    <input type="number" id="rgb-r" min="0" max="255" placeholder="R">
                    <input type="number" id="rgb-g" min="0" max="255" placeholder="G">
                    <input type="number" id="rgb-b" min="0" max="255" placeholder="B">
                </div>

                <div class="input-group">
                    <label for="hsl-h">HSL:</label>
                    <input type="number" id="hsl-h" min="0" max="360" placeholder="H">
                    <input type="number" id="hsl-s" min="0" max="100" placeholder="S">
                    <input type="number" id="hsl-l" min="0" max="100" placeholder="L">
                </div>

                <div class="input-group">
                    <label for="glsl-r">GLSL:</label>
                    <input type="number" id="glsl-r" min="0" max="1" step="0.01" placeholder="R">
                    <input type="number" id="glsl-g" min="0" max="1" step="0.01" placeholder="G">
                    <input type="number" id="glsl-b" min="0" max="1" step="0.01" placeholder="B">
                </div>
            </div>

            <div class="color-preview">
                <label>颜色预览:</label>
                <div id="preview-box"></div>
            </div>
        </div>

        <div class="preset-colors">
            <label>预设颜色:</label>
            <div id="color-table-container"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
