<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Vertex Shader Data Passing</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- 基础设置 (与 Step 1 相同) ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        // renderer.outputColorSpace = THREE.SRGBColorSpace; // 保持默认或根据需要设置

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcccccc);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const geometry = new THREE.SphereGeometry(1, 32, 32);

        // --- GLSL 着色器代码修改 ---

        // 顶点着色器 (Vertex Shader)
        const vertexShader = `
            // Attributes (由 Three.js 自动绑定)
            // attribute vec3 position;    // 模型空间顶点位置
            // attribute vec3 normal;      // 模型空间顶点法线

            // Uniforms (由 Three.js 自动传入)
            // uniform mat4 modelMatrix;      // 模型矩阵 (模型空间 -> 世界空间)
            // uniform mat4 modelViewMatrix;  // 模型视图矩阵 (模型空间 -> 视图空间)
            // uniform mat4 projectionMatrix; // 投影矩阵 (视图空间 -> 裁剪空间)
            // uniform mat3 normalMatrix;     // 法线矩阵 (用于变换法线到视图空间或世界空间)
            // uniform vec3 cameraPosition;   // 相机世界位置 (我们将在下一步添加这个 uniform)

            // Varyings (传递给片元着色器)
            varying vec3 vWorldPosition;
            varying vec3 vWorldNormal;
            varying vec3 vViewDirection; // 从表面点指向相机的向量

            void main() {
                // 1. 计算世界空间位置
                vec4 worldPosition4 = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition4.xyz;

                // 2. 计算世界空间法线 (并归一化)
                // 注意：normalMatrix 是 modelMatrix 的逆转置矩阵的左上 3x3 部分
                // 它将法线从模型空间正确地变换到世界空间（如果光源和相机也在世界空间）
                vWorldNormal = normalize(normalMatrix * normal);

                // 3. 计算世界空间中的视图方向 (并归一化)
                // cameraPosition 是一个 uniform，我们将在下一步从 JS 传入
                // 现在暂时使用 camera.position 的值 (虽然不完全准确，因为 uniform 还没设置)
                // 但结构是正确的
                // vec3 cameraWorldPos = vec3(0.0, 0.0, 5.0); // 暂时硬编码，下一步用 uniform
                // vViewDirection = normalize(cameraWorldPos - vWorldPosition);
                // 更健壮的方式是直接使用 Three.js 提供的 cameraPosition uniform
                vViewDirection = normalize(cameraPosition - vWorldPosition);


                // 4. 计算裁剪空间位置
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        // 片元着色器 (Fragment Shader)
        const fragmentShader = `
            // Varyings (从顶点着色器接收并插值)
            varying vec3 vWorldPosition;
            varying vec3 vWorldNormal;
            varying vec3 vViewDirection;

            void main() {
                // 测试：可视化插值后的世界法线
                // 法线分量范围是 -1 到 1，颜色分量范围是 0 到 1
                // 通过 (normal + 1.0) * 0.5 映射到颜色范围
                vec3 color = normalize(vWorldNormal) * 0.5 + 0.5;
                gl_FragColor = vec4(color, 1.0);

                // 或者测试世界位置 (需要映射到一个可见范围)
                // gl_FragColor = vec4(mod(vWorldPosition, 1.0), 1.0);

                // 或者测试视图方向
                // vec3 colorView = normalize(vViewDirection) * 0.5 + 0.5;
                // gl_FragColor = vec4(colorView, 1.0);
            }
        `;

        // --- ShaderMaterial (添加 cameraPosition uniform) ---
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader
        });

        // --- 网格 (Mesh) ---
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // --- 窗口大小调整处理 (与 Step 1 相同) ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);

        // --- 动画循环 (更新 cameraPosition uniform) ---
        function animate() {
            requestAnimationFrame(animate);

            // sphere.rotation.x += 0.01; // 可以取消注释来旋转球体，观察法线变化
            // sphere.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
