<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1: Basic ShaderMaterial Setup</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // 1. 渲染器 (Renderer)
        const renderer = new THREE.WebGLRenderer({ antialias: true }); // antialias 抗锯齿
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        // 设置输出颜色空间（可选，但推荐了解）
        // renderer.outputColorSpace = THREE.SRGBColorSpace; // Three.js r152+ 默认是 SRGBColorSpace

        // 2. 场景 (Scene)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcccccc); // 设置背景色为浅灰色

        // 3. 相机 (Camera)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5; // 将相机向后移动一点，以便看到物体

        // 4. 几何体 (Geometry)
        const geometry = new THREE.SphereGeometry(1, 32, 32); // 半径为1，分段数为32x32

        // 5. GLSL 着色器代码
        // 顶点着色器 (Vertex Shader)
        const vertexShader = `
            // Three.js 会自动传入一些有用的 uniform 和 attribute
            // uniform mat4 modelViewMatrix;    // 模型视图矩阵
            // uniform mat4 projectionMatrix; // 投影矩阵
            // attribute vec3 position;       // 顶点位置 (模型空间)

            void main() {
                // 将模型空间顶点位置变换到裁剪空间
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        // 片元着色器 (Fragment Shader)
        const fragmentShader = `
            void main() {
                // 输出一个固定的颜色：红色 (R=1, G=0, B=0, A=1)
                gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
            }
        `;

        // 6. ShaderMaterial
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            // 可以添加 uniforms 在这里，但此步骤暂时不需要
            // uniforms: {
            //     time: { value: 1.0 },
            //     resolution: { value: new THREE.Vector2() }
            // }
        });

        // 7. 网格 (Mesh)
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere); // 将球体添加到场景中

        // 8. 窗口大小调整处理
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);

        // 9. 动画循环 (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);

            // 可以在这里更新 uniforms 或执行其他动画逻辑
            // sphere.rotation.x += 0.01;
            // sphere.rotation.y += 0.01;

            renderer.render(scene, camera); // 渲染场景
        }

        animate(); // 开始动画循环

    </script>
</body>
</html>
